<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Welcome to Unordered List Items</h2>
    <ul>
        <li>Lotus</li>
        <li>Tulip</li>
        <li>Cosmos</li>
        <li>Sunflower</li>
        <li>Aster</li>
    </ul>
    <hr>
    <ul type="circle">
        <li>Lotus</li>
        <li>Tulip</li>
        <li>Cosmos</li>
        <li>Sunflower</li>
        <li>Aster</li>
    </ul>
    <hr>
    <ul type="square">
        <li>Lotus</li>
        <li>Tulip</li>
        <li>Cosmos</li>
        <li>Sunflower</li>
        <li>Aster</li>
    </ul>
    <hr>
    <ul type="disc">
        <li>Lotus</li>
        <li>Tulip</li>
        <li>Cosmos</li>
        <li>Sunflower</li>
        <li>Aster</li>
    </ul>
    <hr>
</body>
</html>
