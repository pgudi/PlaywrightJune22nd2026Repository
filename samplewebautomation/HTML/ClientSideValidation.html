<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function display(){
            for(let i=20;i<=40;i++){
                if(i % 2 ==0){
                    document.write("Even Number :"+i+"<br/>")
                }
            }
        }
    </script>
</head>
<body>
    <h2>Welcome Web Page</h2>
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Perspiciatis rem qui aut quod inventore fuga et accusantium, cumque facilis provident numquam repellat soluta impedit dolorum voluptatum odit dolores saepe quis!</p>
    <input type="button" value="Execute Code" onmouseover="display()">
</body>
</html>
