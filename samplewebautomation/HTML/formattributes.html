<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Welcome To Form Attributes</h2>
    <fieldset>
        <legend>Form Attributes</legend>
        <form>
            First Name:
            <input type="text" placeholder="Enter First Name" required autofocus>
            <br>
            <br>
            Nationality:
            <input type="text" value="Indian" readonly>
            <br>
            <br>
            Last Name:
            <input type="text" placeholder="Enter Last Name" maxlength="10">
            <br>
            <br>
            Address1:
            <input type="text" placeholder="Enter Address" disabled>
            <br>
            <br>
            Age:
            <input type="number" name="age" min="18" max="30">
            <br>
            <br>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </form>
    </fieldset>
</body>
</html>
