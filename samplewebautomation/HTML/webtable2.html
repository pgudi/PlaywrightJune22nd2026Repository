<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Welcome to Web Table</h2>
    <table border="2" bgcolor="lightblue" cellspacing="10" cellpadding="10" align="center" height="400" width="400">
        <thead>
            <tr bgcolor="lightgreen">
                <th>DeptNo</th>
                <th>DeptName</th>
                <th>Location</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>10</td>
                <td>Accounting</td>
                <td>Boston</td>
            </tr>
            <tr>
                <td>20</td>
                <td colspan="2" align="center">Research</td>
             
            </tr>
            <tr>
                <td rowspan="2">30</td>
                <td>Sales</td>
                <td>California</td>
            </tr>
            <tr>
                <td>Operations</td>
                <td>Bangalore</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
